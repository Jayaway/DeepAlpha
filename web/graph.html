<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DeepAlpha SignalGraph</title>
    <script>
      (() => {
        const saved = localStorage.getItem("deepalpha-theme");
        document.documentElement.dataset.theme = saved === "dark" ? "dark" : "light";
      })();
    </script>
    <link rel="stylesheet" href="./styles.css" />
    <style>
      body {
        min-height: 100vh;
        overflow: hidden;
        background: var(--home-bg);
      }

      .graph-shell {
        min-height: 100vh;
        padding: 0;
      }

      .home-nav.graph-nav {
        position: fixed;
        right: 1.5rem;
        left: auto;
        width: max-content;
        max-width: calc(100vw - 2rem);
        flex-wrap: nowrap;
        justify-content: flex-end;
      }

      .graph-hero {
        position: fixed;
        top: 7.25rem;
        left: 1.75rem;
        z-index: 3;
        display: grid;
        gap: 0.35rem;
        width: min(24rem, calc(100vw - 3.5rem));
        pointer-events: none;
      }

      .graph-hero h1 {
        margin: 0;
        color: var(--text);
        font-size: clamp(2.15rem, 4.1vw, 3.7rem);
        line-height: 0.86;
        letter-spacing: -0.03em;
      }

      .graph-hero h1 span {
        display: block;
        color: var(--blue);
      }

      .graph-frame-wrap {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        min-height: 100vh;
        overflow: hidden;
        border: 0;
        border-radius: 0;
        background: transparent;
        box-shadow: none;
      }

      .graph-frame {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
        background: transparent;
      }

      .graph-fallback {
        position: absolute;
        inset: auto 1rem 1rem 1rem;
        display: none;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        padding: 0.85rem 1rem;
        border: 1px solid var(--home-card-border);
        border-radius: 0.7rem;
        background: color-mix(in srgb, var(--home-card-solid) 88%, transparent);
        color: var(--muted);
        box-shadow: var(--home-shadow);
        backdrop-filter: blur(18px);
      }

      .graph-fallback.visible {
        display: flex;
      }

      .graph-fallback strong {
        color: var(--text);
      }

      .graph-fallback code {
        color: var(--blue);
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 0.82rem;
      }

      @media (max-width: 820px) {
        body {
          overflow: auto;
        }

        .graph-shell {
          padding: 0;
        }

        .home-nav.graph-nav {
          position: fixed;
          top: 1.25rem;
          right: 1rem;
          left: auto;
          width: max-content;
          max-width: calc(100vw - 2rem);
          flex-wrap: nowrap;
          justify-content: flex-end;
          padding: 0;
        }

        .graph-hero {
          display: none;
        }

        .graph-frame-wrap {
          height: 100vh;
        }

        .graph-fallback {
          display: none;
          align-items: flex-start;
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <div class="graph-shell">
      <nav class="home-nav graph-nav" aria-label="DeepAlpha 图谱导航">
        <a class="nav-pill" href="./index.html">
          <span class="nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M3 11.5 12 4l9 7.5"></path>
              <path d="M5 10.5V20h14v-9.5"></path>
              <path d="M9 20v-6h6v6"></path>
            </svg>
          </span>
          <span>Home</span>
        </a>
        <a class="nav-pill" href="./docs.html">
          <span class="nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M14 2H7a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7z"></path>
              <path d="M14 2v5h5"></path>
              <path d="M9 13h6"></path>
              <path d="M9 17h4"></path>
            </svg>
          </span>
          <span>Docs</span>
        </a>
        <a class="nav-pill" href="./slides.html">
          <span class="nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
              <path d="M8 12h8"></path>
              <path d="M8 15h5"></path>
            </svg>
          </span>
          <span>Slides</span>
        </a>
        <button class="theme-toggle" type="button" id="themeToggle" aria-label="切换主题" aria-pressed="false">
          <span class="theme-toggle-icon" aria-hidden="true"></span>
          <span class="theme-toggle-text">Light</span>
        </button>
      </nav>

      <header class="graph-hero">
        <h1>Signal<span>Graph</span></h1>
      </header>

      <main class="graph-frame-wrap" aria-label="DeepAlpha SignalGraph">
        <iframe class="graph-frame" id="graphFrame" src="./graph_viewer.html" title="DeepAlpha SignalGraph"></iframe>
        <div class="graph-fallback" id="graphFallback">
          <strong>图谱数据未连接</strong>
          <code>/api/graph</code>
        </div>
      </main>
    </div>

    <script>
      const fallback = document.getElementById("graphFallback");
      const graphFrame = document.getElementById("graphFrame");
      const themeToggle = document.querySelector("#themeToggle");
      const themeStorageKey = "deepalpha-theme";

      function getPreferredTheme() {
        const saved = localStorage.getItem(themeStorageKey);
        if (saved === "light" || saved === "dark") return saved;
        return "light";
      }

      function applyTheme(theme) {
        const nextTheme = theme === "dark" ? "dark" : "light";
        document.documentElement.dataset.theme = nextTheme;
        if (!themeToggle) return;
        themeToggle.setAttribute("aria-pressed", String(nextTheme === "dark"));
        const text = themeToggle.querySelector(".theme-toggle-text");
        if (text) text.textContent = nextTheme === "dark" ? "Dark" : "Light";
        graphFrame?.contentWindow?.postMessage({ type: "deepalpha-theme", theme: nextTheme }, "*");
      }

      applyTheme(getPreferredTheme());

      themeToggle?.addEventListener("click", () => {
        const current = document.documentElement.dataset.theme === "dark" ? "dark" : "light";
        const nextTheme = current === "dark" ? "light" : "dark";
        localStorage.setItem(themeStorageKey, nextTheme);
        applyTheme(nextTheme);
      });

      graphFrame?.addEventListener("load", () => {
        applyTheme(document.documentElement.dataset.theme === "dark" ? "dark" : "light");
      });

      async function checkGraphService() {
        try {
          const data = await fetchGraphData();
          if (!Array.isArray(data.nodes)) throw new Error("Graph data unavailable");
          fallback.classList.remove("visible");
        } catch (_) {
          fallback.classList.add("visible");
        }
      }

      async function fetchGraphData() {
        const localUrls = ["../graph_data/关系图谱.json", "./graph_data/关系图谱.json"];
        const urls = location.hostname === "127.0.0.1" || location.hostname === "localhost" || location.protocol === "file:"
          ? [...localUrls, "/api/graph"]
          : ["/api/graph", ...localUrls];
        let lastError = null;
        for (const url of urls) {
          try {
            const response = await fetch(url, { cache: "no-store" });
            if (!response.ok) throw new Error(`${url} ${response.status}`);
            return await response.json();
          } catch (error) {
            lastError = error;
          }
        }
        throw lastError || new Error("Graph data unavailable");
      }

      checkGraphService();
      window.setInterval(checkGraphService, 5000);
    </script>
  </body>
</html>
